# ---------------------------------------------------------------- grouping & ranking
# Grouped aggregates are ORDER BY value DESC, so the first row is the top one -
# except month and quarter, which the compiler always sorts chronologically. A
# "highest month" question therefore cannot be graded by first-row value and is
# checked as a spec instead. Lists carry no "value" column, so lists grade by
# row count. Top-N questions use compare: sum over a LIMIT N subquery, which
# verifies the limit and the sort direction in one number.
- id: q088
  question: Who did we pay the most?
  grade: numeric
  truth_sql: >
    SELECT SUM(transaction_amount) FROM `transaction`
    WHERE transaction_type = 'debit'
    GROUP BY counterparty ORDER BY 1 DESC LIMIT 1
  note: >
    group_by counterparty, debits only, highest first. SELECTION MOBILE has two
    rows that must be summed - a per-row answer gives 79,575 instead of 146,474.

