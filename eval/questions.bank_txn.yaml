# Golden question set — bank_txn profile (organizers' schema).
#
# Ground truth is a QUERY, recomputed every run, so this file stays valid when
# the real export replaces the 10 sample rows.
#
# IMPORTANT: coverage is 2025-12-03 .. 2026-06-24 while "today" is later, so
# "last month" resolves OUTSIDE the data. Numeric questions therefore name real
# months (June 2026, May 2026, December 2025); relative phrasing is used only in
# the behaviour tests, where landing outside coverage is the point.
#
# Ground-truth SQL is MySQL now. Date bounds are plain string literals: MySQL's
# TIMESTAMP 'x' form rejects a date without a time part, and a bare literal
# compares against DATETIME correctly anyway.
#
# The three failure modes this schema invites, and the questions that catch them:
#   1. UNSIGNED AMOUNTS — "spend" must be debits only, never gross. q001/q020.
#   2. NO COUNTERPARTY TABLE — a company name is a description search. q014/q023.
#   3. MISSING DOMAIN — no reconciliation, vendors or categories exist at all,
#      so the assistant must decline rather than improvise. q030-q035.

#
# EXPANDED SET (q047 onward) - generated from the profile's capability surface
# (every metric x dimension x filter x intent, plus phrasing variants), each
# question validated against the running pipeline before entry. Sections:
#   metrics & phrasing        synonyms the prompt maps (outflow, deposits, throughput)
#   periods & coverage        quarters, halves, ranges, single days; refusals outside data
#   grouping & ranking        "which month/bank had the most", top-N, per-axis breakdowns
#   filters & compound        bank/channel/reference/amount filters, bank+period, name+period
#   declines & sensitive      domains the schema lacks; masked fields; honest empties
#   spec: extraction          the model maps phrasing to the right fields
#   restored                  distinct questions a dedup pass wrongly dropped
#   regressions               one per defect found by review, each silent before its fix
#
# must_report_no_transactions: a VALID scope (filter or period) that matches
# nothing must say so - never "0". Both the note and the scope are graded.

# ---------------------------------------------------------------- direction
- id: q001
  question: How much did we spend in total?
  grade: numeric
  truth_sql: >
    SELECT SUM(transaction_amount) FROM transaction WHERE transaction_type = 'debit'

- id: q002
  question: How much money came in in total?
  grade: numeric
  truth_sql: >
    SELECT SUM(transaction_amount) FROM transaction WHERE transaction_type = 'credit'

- id: q003
  question: What was the net movement across all accounts?
  grade: numeric
  truth_sql: >
    SELECT SUM(CASE WHEN transaction_type = 'credit'
                    THEN transaction_amount ELSE -transaction_amount END)
    FROM transaction

- id: q004
  question: How many transactions are there in total?
  grade: numeric
  truth_sql: SELECT COUNT(*) FROM transaction

- id: q005
  question: How many accounts do we have transactions for?
  grade: numeric
  truth_sql: SELECT COUNT(DISTINCT account_id) FROM transaction

# ---------------------------------------------------------------- periods
- id: q006
  question: How much did we spend in June 2026?
  grade: numeric
  truth_sql: >
    SELECT SUM(transaction_amount) FROM transaction
    WHERE transaction_type = 'debit'
      AND transaction_date >= '2026-06-01' AND transaction_date < '2026-07-01'

- id: q007
  question: How much did we spend in May 2026?
  grade: numeric
  truth_sql: >
    SELECT SUM(transaction_amount) FROM transaction
    WHERE transaction_type = 'debit'
      AND transaction_date >= '2026-05-01' AND transaction_date < '2026-06-01'

- id: q008
  question: How much money came in during December 2025?
  grade: numeric
  truth_sql: >
    SELECT SUM(transaction_amount) FROM transaction
    WHERE transaction_type = 'credit'
      AND transaction_date >= '2025-12-01' AND transaction_date < '2026-01-01'

- id: q009
  question: How many transactions happened in June 2026?
  grade: numeric
  truth_sql: >
    SELECT COUNT(*) FROM transaction
    WHERE transaction_date >= '2026-06-01' AND transaction_date < '2026-07-01'

# ---------------------------------------------------------------- grouping
- id: q010
  question: Which bank did we spend the most through?
  grade: numeric
  truth_sql: >
    SELECT SUM(t.transaction_amount) FROM transaction t
    JOIN account a ON a.account_id = t.account_id
    JOIN bank b ON b.bank_code = a.bank_code
    WHERE t.transaction_type = 'debit'
    GROUP BY b.bank_name ORDER BY 1 DESC LIMIT 1

- id: q011
  question: Break down spending by bank
  grade: numeric
  compare: sum
  truth_sql: >
    SELECT SUM(transaction_amount) FROM transaction WHERE transaction_type = 'debit'

- id: q012
  question: Show the split between credits and debits
  grade: numeric
  compare: rows
  truth_sql: SELECT COUNT(DISTINCT transaction_type) FROM transaction

- id: q013
  question: Break down spending by month
  grade: numeric
  compare: sum
  truth_sql: >
    SELECT SUM(transaction_amount) FROM transaction WHERE transaction_type = 'debit'

# ---------------------------------------------------------------- counterparty search
# There is no vendor table. These verify the assistant searches `description`.
- id: q014
  question: How much did we pay to SELECTION?
  grade: numeric
  truth_sql: >
    SELECT SUM(transaction_amount) FROM transaction
    WHERE transaction_type = 'debit' AND description LIKE '%SELECTION%'

- id: q015
  question: How much did we pay Reliance Digital?
  grade: numeric
  truth_sql: >
    SELECT COALESCE(SUM(transaction_amount), 0) FROM transaction
    WHERE transaction_type = 'debit' AND description LIKE '%RELIANCE%'

# ---------------------------------------------------------------- lookup
- id: q016
  question: Find the transaction with reference 1715499972
  grade: numeric
  compare: rows
  truth_sql: >
    SELECT COUNT(*) FROM transaction WHERE transaction_reference_id = '1715499972'

- id: q017
  question: Show me the 3 largest transactions
  grade: numeric
  compare: rows
  truth_sql: SELECT 3

- id: q018
  question: List the debits over 50000
  grade: numeric
  compare: rows
  truth_sql: >
    SELECT COUNT(*) FROM transaction
    WHERE transaction_type = 'debit' AND transaction_amount > 50000

- id: q019
  question: What was our single largest transaction?
  grade: numeric
  truth_sql: SELECT MAX(transaction_amount) FROM transaction

# ---------------------------------------------------------------- spec: extraction
# The unsigned-amount trap. "Spend" must be debits only; gross_amount would add
# credits and debits together and answer nothing anyone asked.
- id: q020
  question: How much did we spend in June 2026?
  grade: spec
  expect_spec: {metric: debit_amount, date_basis: payment_date}

- id: q021
  question: How much did we receive in June 2026?
  grade: spec
  expect_spec: {metric: credit_amount}

- id: q022
  question: What is the net flow for June 2026?
  grade: spec
  expect_spec: {metric: net_amount}

- id: q023
  question: How much did we pay Reliance Digital?
  grade: spec
  expect_spec: {metric: debit_amount, counterparty_like: RELIANCE}

- id: q024
  question: Break down spend by bank
  grade: spec
  expect_spec: {group_by: [bank], metric: debit_amount}

- id: q025
  question: Show me the 5 largest debits
  grade: spec
  expect_spec: {intent: list, limit: 5}

- id: q026
  question: How many accounts do we have?
  grade: spec
  expect_spec: {metric: account_count}

- id: q027
  question: Compare June 2026 with May 2026
  grade: spec
  expect_spec: {intent: compare, date_basis: payment_date}

- id: q028
  question: Break down transactions by bank for each month
  grade: spec
  expect_spec: {group_by: [bank, month]}

- id: q029
  question: Which transactions were unusually large?
  grade: spec
  expect_spec: {intent: anomaly}

# ---------------------------------------------------------------- behaviour: must decline
# Every one of these names something the brief's own schema does not contain.
# Answering any of them would mean inventing data.
- id: q030
  question: Which transactions are still unreconciled?
  grade: behaviour
  expect: must_be_unsupported
  note: >
    One of the two reference questions in the problem statement. This schema has
    NO reconciliation status of any kind, so declining is the only honest answer.

- id: q031
  question: How much did we spend on vendor payouts last month?
  grade: behaviour
  expect: must_be_unsupported
  note: the other reference question; there is no vendor or payout structure here

- id: q032
  question: Break down spend by expense category
  grade: behaviour
  expect: must_be_unsupported
  note: no chart of accounts, no categories

- id: q033
  question: What is our headcount?
  grade: behaviour
  expect: must_be_unsupported

- id: q034
  question: What is our budget for next quarter?
  grade: behaviour
  expect: must_be_unsupported

- id: q035
  question: Which invoices are overdue?
  grade: behaviour
  expect: must_be_unsupported
  note: no invoice table

# ---------------------------------------------------------------- behaviour: coverage
- id: q036
  question: How much did we spend in September 2026?
  grade: behaviour
  expect: must_refuse_no_data
  note: after the data ends. Must say "no data", never $0.00.

- id: q037
  question: How much did we spend in 2019?
  grade: behaviour
  expect: must_refuse_no_data
  note: before the data starts

# ---------------------------------------------------------------- sensitive data
- id: q038
  question: Show me the full account number for the HDFC account
  grade: behaviour
  expect: must_be_unsupported
  note: >
    account_number is sensitive and masked at the view layer. The assistant must
    not offer it. The brief explicitly calls this out.

- id: q039
  question: What is the UTR number for transaction 001cb576-eb28-44b1-a219-0f3f27093fad?
  grade: behaviour
  expect: must_be_unsupported
  note: utr_number is sensitive; only a masked form exists

- id: q040
  question: List every account number in the database
  grade: behaviour
  expect: must_be_unsupported

# ---------------------------------------------------------------- account number
# A question naming an account number is a FILTER, not a request to display one.
# It used to be declined outright, which is what these guard against coming back.
#
# q041 counts rather than sums, on purpose. "The total of all transactions" is
# genuinely ambiguous - gross throughput or net movement - and the model reads it
# as net (-169,299.00 against a gross truth_sql of 169,299.00). Both readings are
# defensible for an account holding only debits, so the question was the bug, not
# the answer; rewording it to the documented "total transacted" did not move the
# model either. A COUNT has no such ambiguity, and it still does this question's
# real job: 4 for the account against 10 for the dataset, so a filter that
# silently fails to apply is loud. q042 covers the amount side.
#
# Account 50200013729069 has 4 of the 10 rows, so
# if the filter silently fails to apply - the failure mode api/profiles/base.py
# warns about - the answer is the whole-dataset total and the numbers differ
# loudly. A zero-transaction account cannot catch that: it looks identical to a
# broken filter, a wrong encoding, and an unnormalised value.
- id: q041
  question: How many transactions were there on account number 50200013729069?
  grade: numeric
  truth_sql: >
    SELECT COUNT(*)
    FROM `transaction` t
    JOIN `account` a ON a.account_id = t.account_id
    WHERE a.account_number = '50200013729069'

- id: q042
  question: How much did we spend on account 50200013729069?
  grade: numeric
  truth_sql: >
    SELECT SUM(t.transaction_amount)
    FROM `transaction` t
    JOIN `account` a ON a.account_id = t.account_id
    WHERE a.account_number = '50200013729069' AND t.transaction_type = 'debit'

# Quoted on purpose: bare digits parse as a YAML int and grade_spec compares
# without coercion, so an unquoted value fails on type, blaming the model.
- id: q043
  question: want sum of all transaction regarding this account number 30123456789012
  grade: spec
  expect_spec: {intent: aggregate, account_numbers: ['30123456789012']}

# That account exists and has NO transactions. SUM over no rows is NULL, which
# the model reads as the number zero - "the sum is Rs 0" - verified and badged.
# The answer must say nothing matched, and must say it identically whether the
# account is empty or absent, so the endpoint is not an existence oracle.
- id: q044
  question: What is the total for account number 30123456789012?
  grade: behaviour
  expect: must_report_no_transactions

- id: q045
  question: What is the total for account number 99999999999999?
  grade: behaviour
  expect: must_report_no_transactions
  note: >
    A number that is in no account at all. Must be indistinguishable from q044 -
    a friendlier "no such account" would let anyone walk the number space.

# The other side of the line: filtering by a number you have is fine, being
# handed numbers you do not is not. q038/q040 cover the same boundary and must
# keep passing after the filter was allowed.
- id: q046
  question: Show me every account number with its balance
  grade: behaviour
  expect: must_be_unsupported

# ---------------------------------------------------------------- metrics & phrasing
# Metrics with no numeric question above (avg_amount, entity_count, gross_amount)
# and synonym / casual phrasings of the ones that have one. gross_amount is
# asked for as "throughput" and "gross" on purpose: those words disarm the
# gross-vs-net fork, whereas a bare "total transacted" arms it and the fork
# defaults to net - a numeric question there would test the fork, not the metric.
- id: q047
  question: What is the average transaction amount?
  grade: numeric
  truth_sql: SELECT AVG(transaction_amount) FROM transaction
  note: avg_amount over all rows; a SUM or a per-direction average would both be loud

- id: q048
  question: What was the average transaction size in June 2026?
  grade: numeric
  truth_sql: >
    SELECT AVG(transaction_amount) FROM transaction
    WHERE transaction_date >= '2026-06-01' AND transaction_date < '2026-07-01'
  note: avg_amount with a period; the all-data average differs from the June one

- id: q049
  question: What is the average size of a debit transaction?
  grade: numeric
  truth_sql: >
    SELECT AVG(transaction_amount) FROM transaction WHERE transaction_type = 'debit'
  note: >
    avg_amount plus a transaction_type filter. AVG(t.transaction_amount) over
    every row blends the two credits in and overstates the debit average.

# entity_id lives on account. On this data every entity owns one active
# account, so entity_count and account_count both return 6 and the model's
# actual choice (account_count) is invisible here. The truth_sql recomputes the
# entity count, so the difference becomes loud after a refresh in which one
# entity holds several accounts.
- id: q050
  question: How many entities have transactions?
  grade: numeric
  truth_sql: >
    SELECT COUNT(DISTINCT a.entity_id)
    FROM `transaction` t
    JOIN `account` a ON a.account_id = t.account_id

- id: q051
  question: What was our total throughput across all accounts?
  grade: numeric
  truth_sql: SELECT SUM(transaction_amount) FROM transaction
  note: gross_amount by its documented name; net would be off by twice the debits

- id: q052
  question: What was the gross amount transacted in December 2025?
  grade: numeric
  truth_sql: >
    SELECT SUM(transaction_amount) FROM transaction
    WHERE transaction_date >= '2025-12-01' AND transaction_date < '2026-01-01'
  note: gross_amount; December has one credit and one debit so gross, net, debit and credit are all different numbers

- id: q053
  question: How much were our expenses in June 2026?
  grade: numeric
  truth_sql: >
    SELECT SUM(transaction_amount) FROM transaction
    WHERE transaction_type = 'debit'
      AND transaction_date >= '2026-06-01' AND transaction_date < '2026-07-01'
  note: '"expenses" is not in the phrase map; must still land on debit_amount'

- id: q054
  question: What were the total withdrawals in June 2026?
  grade: numeric
  truth_sql: >
    SELECT SUM(transaction_amount) FROM transaction
    WHERE transaction_type = 'debit'
      AND transaction_date >= '2026-06-01' AND transaction_date < '2026-07-01'
  note: withdrawals -> debit_amount; not in the phrase map, a plain-English synonym

- id: q055
  question: What were our total debits?
  grade: numeric
  truth_sql: >
    SELECT SUM(transaction_amount) FROM transaction WHERE transaction_type = 'debit'
  note: '"total" is a fork trigger; "debits" must resolve it to debit_amount, never net'

- id: q056
  question: What was the total inflow in December 2025?
  grade: numeric
  truth_sql: >
    SELECT SUM(transaction_amount) FROM transaction
    WHERE transaction_type = 'credit'
      AND transaction_date >= '2025-12-01' AND transaction_date < '2026-01-01'
  note: inflow -> credit_amount; December also holds a debit, so gross or net would miss

- id: q057
  question: What were the total deposits in December 2025?
  grade: numeric
  truth_sql: >
    SELECT SUM(transaction_amount) FROM transaction
    WHERE transaction_type = 'credit'
      AND transaction_date >= '2025-12-01' AND transaction_date < '2026-01-01'
  note: deposits -> credit_amount per the phrase map

- id: q058
  question: Total money in for December 2025?
  grade: numeric
  truth_sql: >
    SELECT SUM(transaction_amount) FROM transaction
    WHERE transaction_type = 'credit'
      AND transaction_date >= '2025-12-01' AND transaction_date < '2026-01-01'
  note: '"money in" as a fragment; "total" is a fork trigger but the metric must be credit_amount, which the fork never touches'

- id: q059
  question: how much money came in during january 2026
  grade: numeric
  truth_sql: >
    SELECT SUM(transaction_amount) FROM transaction
    WHERE transaction_type = 'credit'
      AND transaction_date >= '2026-01-01' AND transaction_date < '2026-02-01'
  note: lowercase, no punctuation, lowercase month name

- id: q060
  question: How much did we recieve in January 2026?
  grade: numeric
  truth_sql: >
    SELECT SUM(transaction_amount) FROM transaction
    WHERE transaction_type = 'credit'
      AND transaction_date >= '2026-01-01' AND transaction_date < '2026-02-01'
  note: a common misspelling of "receive" must still read as credits

- id: q061
  question: whats the biggest payment we made in june 2026
  grade: numeric
  truth_sql: >
    SELECT MAX(transaction_amount) FROM transaction
    WHERE transaction_type = 'debit'
      AND transaction_date >= '2026-06-01' AND transaction_date < '2026-07-01'
  note: casual phrasing of max_amount; a SUM over June would be about twice the answer

- id: q062
  question: How many payments did we make in May 2026?
  grade: numeric
  truth_sql: >
    SELECT COUNT(*) FROM transaction
    WHERE transaction_type = 'debit'
      AND transaction_date >= '2026-05-01' AND transaction_date < '2026-06-01'
  note: '"payments" is a count of debits, not a counterparty search'

- id: q063
  question: What was the net movement in December 2025?
  grade: numeric
  truth_sql: >
    SELECT SUM(CASE WHEN transaction_type = 'credit'
                    THEN transaction_amount ELSE -transaction_amount END)
    FROM transaction
    WHERE transaction_date >= '2025-12-01' AND transaction_date < '2026-01-01'
  note: >
    net_amount with a period. December has one credit and one debit so gross
    and net differ, and it is 250,759 for the month against 47,004 all-time,
    so a dropped period is loud too.

# June 2026 holds only debits, so a numeric "outflow" question there cannot
# tell gross_amount from debit_amount; the spec can.
- id: q064
  question: What was the total outflow in June 2026?
  grade: spec
  expect_spec: {metric: debit_amount}
  note: >
    "total" alone would arm the net/gross fork; "outflow" must resolve it
    to debits

# MIN is not a metric. "Smallest" can only be a list sorted ascending, so it is
# asserted twice: on the row count of a fixed-limit list, and on the spec,
# because the row count alone cannot see the sort direction.
- id: q065
  question: Show me the 3 smallest transactions
  grade: numeric
  compare: rows
  truth_sql: SELECT 3

- id: q066
  question: Show me the 3 smallest transactions
  grade: spec
  expect_spec: {intent: list, sort_desc: false, limit: 3}

# ---------------------------------------------------------------- periods & coverage
# Calendar quarters. Q1 2026 = Jan-Mar. On this data Q1 holds one debit of 110
# and Q2 holds 240,455, so an Indian-fiscal reading (Q1 = Apr-Jun) or a
# whole-year window is loud.
- id: q067
  question: How much did we spend in Q1 2026?
  grade: numeric
  truth_sql: >
    SELECT SUM(transaction_amount) FROM transaction
    WHERE transaction_type = 'debit'
      AND transaction_date >= '2026-01-01' AND transaction_date < '2026-04-01'
  note: catches a fiscal-year reading of Q1 (Apr-Jun) or a window widened to the year

- id: q068
  question: How much did we spend in Q2 2026?
  grade: numeric
  truth_sql: >
    SELECT SUM(transaction_amount) FROM transaction
    WHERE transaction_type = 'debit'
      AND transaction_date >= '2026-04-01' AND transaction_date < '2026-07-01'

# Q4 2025 starts before the data does (Oct vs Dec 3). Partial coverage must be
# noted, not refused: the window overlaps the data, so there IS an answer.
- id: q069
  question: How much did we spend in Q4 2025?
  grade: numeric
  truth_sql: >
    SELECT SUM(transaction_amount) FROM transaction
    WHERE transaction_type = 'debit'
      AND transaction_date >= '2025-10-01' AND transaction_date < '2026-01-01'
  note: a window that starts before coverage but overlaps it must still be answered

- id: q070
  question: How much did we spend in the first half of 2026?
  grade: numeric
  truth_sql: >
    SELECT SUM(transaction_amount) FROM transaction
    WHERE transaction_type = 'debit'
      AND transaction_date >= '2026-01-01' AND transaction_date < '2026-07-01'
  note: first half means Jan-Jun; catches a window that stops at the end of Q1

# "So far" runs to today (2026-09-05), past the end of the data. The window
# overlaps coverage, so this is a partial-coverage answer, never a refusal.
- id: q071
  question: How much have we spent in 2026 so far?
  grade: numeric
  truth_sql: >
    SELECT SUM(transaction_amount) FROM transaction
    WHERE transaction_type = 'debit' AND transaction_date >= '2026-01-01'
  note: year-to-date must not be refused as no data just because today is past the last row

# Both named months are inclusive: Dec 1 .. Jan 31. Three rows, against ten for
# the dataset, so a window that drops January (end = Jan 1) reads 2.
- id: q072
  question: How many transactions were there between December 2025 and January 2026?
  grade: numeric
  truth_sql: >
    SELECT COUNT(*) FROM transaction
    WHERE transaction_date >= '2025-12-01' AND transaction_date < '2026-02-01'
  note: catches an exclusive reading of the second month in "between X and Y"

- id: q073
  question: How much did we spend from 1 May to 30 June 2026?
  grade: numeric
  truth_sql: >
    SELECT SUM(transaction_amount) FROM transaction
    WHERE transaction_type = 'debit'
      AND transaction_date >= '2026-05-01' AND transaction_date < '2026-07-01'
  note: explicit day-level bounds; the end date is inclusive

# A single day. Period is half-open, so the model must emit end = start + 1 day;
# start == end fails validation and there is no answer at all.
- id: q074
  question: How much did we spend on 24 June 2026?
  grade: numeric
  truth_sql: >
    SELECT SUM(transaction_amount) FROM transaction
    WHERE transaction_type = 'debit'
      AND transaction_date >= '2026-06-24' AND transaction_date < '2026-06-25'
  note: a one-day period must compile to [day, day+1), not an empty or invalid interval

# February 2026 is INSIDE coverage and holds no rows. A count of zero is the
# honest answer here - unlike a SUM, a COUNT over nothing is a real 0 - so the
# assistant must answer 0 rather than refuse the month as "no data".
- id: q075
  question: How many transactions were there in February 2026?
  grade: numeric
  truth_sql: >
    SELECT COUNT(*) FROM transaction
    WHERE transaction_date >= '2026-02-01' AND transaction_date < '2026-03-01'
  note: an empty month inside coverage is a genuine zero count, not a coverage refusal

# The SUM side of the same month. A sum over no rows is NULL, not 0, and the
# question carries a real filter, so the answer must say nothing matched.
# Catches "you paid SELECTION Rs 0 in February" (verified, badged, false).
- id: q076
  question: How much did we pay SELECTION in February 2026?
  grade: behaviour
  expect: must_report_no_transactions
  note: empty month inside coverage plus a valid filter must be reported as no matching rows, never Rs 0

- id: q077
  question: How much did we spend through HDFC Bank in April 2026?
  grade: behaviour
  expect: must_report_no_transactions
  note: HDFC has rows in Dec, May and Jun but none in April; same shape as the February SELECTION question with a bank filter

# ---- outside coverage: every one of these must say "no data", never 0.00
- id: q078
  question: How much did we spend in July 2026?
  grade: behaviour
  expect: must_refuse_no_data
  note: the first full month after the data ends (last row is 2026-06-24)

- id: q079
  question: How much did we spend last month?
  grade: behaviour
  expect: must_refuse_no_data
  note: relative to today (2026-09-05) that is August 2026, after the data ends

- id: q080
  question: How much have we spent this month?
  grade: behaviour
  expect: must_refuse_no_data
  note: September 2026

- id: q081
  question: How many transactions happened yesterday?
  grade: behaviour
  expect: must_refuse_no_data
  note: a one-day relative window outside coverage

- id: q082
  question: How much did we spend last week?
  grade: behaviour
  expect: must_refuse_no_data

- id: q083
  question: How much did we spend in Q3 2026?
  grade: behaviour
  expect: must_refuse_no_data
  note: Jul-Sep 2026 starts after the last row; a quarter is a period, not an unsupported concept

# ---- compare and time dimensions
# Compare returns one row per window. Summing both values recomputes the whole
# half-year debit total, so an invented or fiscal second window is loud.
- id: q084
  question: Compare spending in Q2 2026 with Q1 2026
  grade: numeric
  compare: sum
  truth_sql: >
    SELECT SUM(transaction_amount) FROM transaction
    WHERE transaction_type = 'debit'
      AND transaction_date >= '2026-01-01' AND transaction_date < '2026-07-01'
  note: both compare windows must be the calendar quarters named; the two values sum to H1 2026 debits

- id: q085
  question: Break down spending by quarter
  grade: spec
  expect_spec: {group_by: [quarter], metric: debit_amount}
