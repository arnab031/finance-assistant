# ---------------------------------------------------------------- reconciliation
# Re-graded after the first canary run. "Not reconciled" is the scope ambiguity
# itself, so asking is correct behaviour and grading it numerically was an error
# in this file, not in the assistant.
- id: q024
  question: What is the total exposure of items that are not reconciled?
  grade: behaviour
  expect: must_clarify
  expect_kind: scope

- id: q025
  question: How much is sitting in Disputed status?
  grade: numeric
  truth_sql: >
    SELECT SUM(ledger_amount) FROM reconciliation WHERE reconciliation_status = 'Disputed'

- id: q026
  question: How much is Partially Matched?
  grade: numeric
  truth_sql: >
    SELECT SUM(ledger_amount) FROM reconciliation WHERE reconciliation_status = 'Partially Matched'

- id: q027
  question: How many transactions are Disputed?
  grade: numeric
  truth_sql: SELECT COUNT(*) FROM reconciliation WHERE reconciliation_status = 'Disputed'

- id: q028
  question: How much has been reconciled successfully?
  grade: numeric
  truth_sql: >
    SELECT SUM(ledger_amount) FROM reconciliation WHERE reconciliation_status = 'Reconciled'

- id: q029
  question: Show me the reconciliation status breakdown
  grade: numeric
  compare: rows
  truth_sql: SELECT COUNT(DISTINCT reconciliation_status) FROM reconciliation

# ---------------------------------------------------------------- fiscal year
# Re-graded: "fiscal year 2025" is precisely the temporal fork, so a clarify is
# the right answer and a number would have been the wrong one.
- id: q030
  question: How much was charged to fiscal year 2025?
  grade: behaviour
  expect: must_clarify
  expect_kind: temporal

- id: q031
  question: How many transactions were booked to fiscal year 2027?
  grade: numeric
  truth_sql: SELECT COUNT(*) FROM transactions WHERE fiscal_year = '2027'

