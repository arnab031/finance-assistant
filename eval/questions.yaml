# ---------------------------------------------------------------- behaviour: must clarify
- id: q041
  question: How much did we spend in FY2026?
  grade: behaviour
  expect: must_clarify
  expect_kind: temporal
  note: >
    $16.82B by the fiscal_year column vs $18.16B by the Jul-Jun date window -
    a $1.34B gap. Only 7.4% relative, so this is the case that proves relative
    spread alone is the wrong materiality test.

- id: q042
  question: Which transactions are still unreconciled?
  grade: behaviour
  expect: must_clarify
  expect_kind: scope
  note: strict $3.31B vs broad $4.62B, a 28.5% spread

- id: q043
  question: How much did we pay the bank of new york?
  grade: behaviour
  expect: must_clarify
  expect_kind: entity
  note: two near-identical entities of near-identical size; ranking by similarity alone is a coin flip on $1.4B

- id: q044
  question: How much did we pay McKesson?
  grade: behaviour
  expect: must_clarify
  expect_kind: entity
  note: three McKesson entities, top holds only 64% of combined spend

- id: q045
  question: What did we spend in fiscal 2025?
  grade: behaviour
  expect: must_clarify
  expect_kind: temporal

