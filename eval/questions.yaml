# Golden question set.
#
# Ground truth is a QUERY, never a literal. It is recomputed on every run, so it
# cannot go stale and it survives a dataset swap without editing 50 numbers.
#
# grade:
#   numeric    the answer must match truth_sql. `compare` picks what is compared:
#              first (default) = first row's `value`; sum = total of the column;
#              rows = number of rows returned.
#   spec       named QuerySpec fields must match. Isolates EXTRACTION from the
#              compiler: if spec passes but numeric fails, the compiler broke.
#   behaviour  the assistant must clarify / refuse / decline. No number involved.
#
# Reference dates (settings.reference_date = wall clock, data ends 2026-08-29):
#   "last month"   = August 2026        "last quarter"   = Q2 2026 (Apr-Jun)
#   "last 12 months" = 2025-09 .. 2026-08

# ---------------------------------------------------------------- simple aggregate
- id: q001
  question: How much did we spend on vendor payouts last month?
  grade: numeric
  truth_sql: >
    SELECT SUM(amount_paid) FROM transactions
    WHERE transaction_date >= DATE '2026-08-01' AND transaction_date < DATE '2026-09-01'

- id: q002
  question: What was our total spend across all the data?
  grade: numeric
  truth_sql: SELECT SUM(amount_paid) FROM transactions

- id: q003
  question: How many transactions were there last month?
  grade: numeric
  truth_sql: >
    SELECT COUNT(*) FROM transactions
    WHERE transaction_date >= DATE '2026-08-01' AND transaction_date < DATE '2026-09-01'

- id: q004
  question: How many different vendors did we pay in August 2026?
  grade: numeric
  truth_sql: >
    SELECT COUNT(DISTINCT vendor_id) FROM transactions
    WHERE transaction_date >= DATE '2026-08-01' AND transaction_date < DATE '2026-09-01'

- id: q005
  question: How much did we spend in July 2026?
  grade: numeric
  truth_sql: >
    SELECT SUM(amount_paid) FROM transactions
    WHERE transaction_date >= DATE '2026-07-01' AND transaction_date < DATE '2026-08-01'

- id: q006
  question: How much did we spend last quarter?
  grade: numeric
  truth_sql: >
    SELECT SUM(amount_paid) FROM transactions
    WHERE transaction_date >= DATE '2026-04-01' AND transaction_date < DATE '2026-07-01'

- id: q007
  question: What did we spend in the last 12 months?
  grade: numeric
  truth_sql: >
    SELECT SUM(amount_paid) FROM transactions
    WHERE transaction_date >= DATE '2025-09-01' AND transaction_date < DATE '2026-09-01'

- id: q008
